name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: ffmpeg (usado pelos testes de vídeo)
        run: choco install ffmpeg --no-progress -y
      - name: Sintaxe
        run: node scripts/check.mjs
      - name: Testes do servidor
        run: node --test test/*.test.mjs
      - name: Auditoria de segurança
        run: node scripts/audit-security.mjs
