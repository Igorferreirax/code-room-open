name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Permissão mínima: o CI só lê o código. Não publica, não comenta, não mexe em nada do repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    # O Code Room é feito para Windows (PowerShell, árvore de processos, atalhos), então os testes rodam no Windows.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      # Ações presas a um commit exato (não a uma etiqueta que pode ser movida).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Sintaxe de todos os arquivos
        run: node scripts/check.mjs
      - name: Testes automáticos
        run: npm test
      - name: Auditoria de segurança (ataques reais contra um serviço isolado)
        run: node scripts/audit-security.mjs
      - name: Instalar Playwright para os testes visuais
        run: |
          python -m pip install playwright numpy
          python -m playwright install chromium
      - name: Testes da interface e onboarding
        shell: pwsh
        run: |
          $scripts = 'ui_smoke.py','crawl_ui.py','ui_assistant.py','ui_onboarding.py','ui_mention.py','ui_providers.py','test_radio.py','ui_touch.py','ui_canvas_live.py','ui_live.py','ui_updates.py'
          foreach ($script in $scripts) {
            python "scripts/$script"
            if ($LASTEXITCODE -ne 0) { throw "Roteiro falhou: $script" }
          }
