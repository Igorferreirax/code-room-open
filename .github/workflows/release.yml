name: Release

# Gera o zip portátil e o Setup.exe no GitHub (build limpo e público).
# - Ao enviar uma tag vX.Y.Z: gera, assina (se o SignPath estiver configurado) e publica na Release.
# - Manualmente (Actions › Release › Run workflow): gera e guarda os arquivos como artefato, sem publicar.
# Guia de ativação da assinatura: docs/ASSINATURA.md

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  pacotes:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Testes do servidor
        run: node --test test/*.test.mjs
      - name: Gerar pacotes
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer/build.ps1
      - name: Conferir que o Setup.exe foi gerado
        shell: pwsh
        run: |
          if (-not (Get-ChildItem dist -Filter '*-Setup.exe')) { throw 'Setup.exe não foi gerado.' }
      - name: Guardar Setup.exe sem assinatura
        id: sem-assinatura
        uses: actions/upload-artifact@v4
        with:
          name: setup-sem-assinatura
          path: dist/*-Setup.exe
      - name: Assinar com o SignPath
        if: ${{ env.SIGNPATH_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.sem-assinatura.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: assinado
      - name: Trocar pelo Setup.exe assinado
        if: ${{ env.SIGNPATH_TOKEN != '' }}
        shell: pwsh
        run: |
          $assinado = Get-ChildItem assinado -Filter '*-Setup.exe' -Recurse | Select-Object -First 1
          if (-not $assinado) { throw 'O SignPath não devolveu o Setup.exe assinado.' }
          Copy-Item -LiteralPath $assinado.FullName -Destination (Join-Path dist $assinado.Name) -Force
          $sig = Get-AuthenticodeSignature (Join-Path dist $assinado.Name)
          Write-Host "Assinatura: $($sig.Status) ($($sig.SignerCertificate.Subject))"
          if ($sig.Status -ne 'Valid') { throw "Assinatura inválida: $($sig.Status)" }
      - name: Recalcular SHA-256
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer/sums.ps1
      - name: Guardar pacotes
        uses: actions/upload-artifact@v4
        with:
          name: pacotes
          path: dist/*
      - name: Publicar na Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $notas = "docs/RELEASE-NOTES-$tag.md"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $notas) { gh release create $tag --title "Code Room $($tag.TrimStart('v'))" --notes-file $notas }
            else { gh release create $tag --title "Code Room $($tag.TrimStart('v'))" --generate-notes }
          }
          gh release upload $tag (Get-ChildItem dist -File).FullName --clobber
